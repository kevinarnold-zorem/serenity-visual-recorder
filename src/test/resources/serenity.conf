webdriver {
  driver = chrome
  autodownload = true
  capabilities {
    browserName = "chrome"
    "goog:chromeOptions" {
      args = [
        "--start-maximized",
        "--no-sandbox",
        "--disable-gpu",
        "--disable-notifications",
        "--disable-infobars"
      ]
      prefs {
        "credentials_enable_service" = false
        "profile.password_manager_enabled" = false
        "profile.password_manager_leak_detection" = false
      }
    }
  }
}

headless.mode = false

serenity {
  take.screenshots = AFTER_EACH_STEP
  project.name = "Serenity Visual Recorder"
}
